# nginx que sirve la landing pública y la PWA construida. Caddy (borde) hace de
# reverse proxy y TLS; nginx solo entrega archivos estáticos.
#
#   /         -> landing pública (landing/index.html)           TSK-OFF-023
#   /app/     -> PWA (build de Vite con base /app/)
#   /sw.js    -> retira el service worker antiguo de la raíz (landing/sw.js)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Redirecciones relativas: detrás de Caddy (HTTPS) no deben salir con http://.
    absolute_redirect off;

    # ── App ────────────────────────────────────────────────────────────
    location = /app {
        return 301 /app/;
    }

    # Assets con hash de contenido: cacheables para siempre.
    location /app/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El shell de la PWA y el service worker NO se cachean (se actualizan solos).
    location = /app/sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /app/manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # SPA: cualquier ruta desconocida bajo /app/ cae al shell de la app.
    location /app/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /app/index.html;
    }

    # ── Landing ────────────────────────────────────────────────────────
    # Service worker de retiro: debe llegar siempre fresco a los teléfonos que
    # aún tienen registrado el de la raíz.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
