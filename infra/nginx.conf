# nginx que sirve la PWA construida. Caddy (borde) hace de reverse proxy y TLS;
# nginx solo entrega archivos estáticos.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Assets con hash de contenido: cacheables para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El shell de la PWA y el service worker NO se cachean (se actualizan solos).
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # SPA: cualquier ruta desconocida cae a index.html (router del cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
