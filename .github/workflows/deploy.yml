name: Deploy (demo Fase 3)

# Se dispara a mano (`workflow_dispatch`) a propósito: el provisionamiento real
# es DESPUÉS del HITO 2 (congelación). No auto-despliega en cada push a main.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit/rama/tag a desplegar (vacío = main)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Construir y publicar imágenes (GHCR)
    runs-on: ubuntu-latest
    outputs:
      prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Calcular prefijo de imágenes
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Backend (runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-backend:latest
            ${{ steps.meta.outputs.prefix }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 'Backend (tools: migraciones/seed)'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: build
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-backend-tools:latest
            ${{ steps.meta.outputs.prefix }}-backend-tools:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend (PWA + nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/frontend.Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api/v1
            VITE_DEMO_PASSWORD=${{ secrets.VITE_DEMO_PASSWORD }}
          tags: |
            ${{ steps.meta.outputs.prefix }}-frontend:latest
            ${{ steps.meta.outputs.prefix }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en el VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copiar manifiestos al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'infra/docker-compose.prod.yml,infra/Caddyfile,infra/postgres/init,infra/backup'
          target: '/opt/terreno'

      - name: Migrar y levantar
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/terreno/infra
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml --profile tools run --rm migrate
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml ps
