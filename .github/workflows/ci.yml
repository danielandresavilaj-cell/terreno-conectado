name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint + typecheck + build (monorepo)
    runs-on: ubuntu-latest
    env:
      VITE_DEMO_PASSWORD: TcDemo2026!
    steps:
      - uses: actions/checkout@v4
      - name: Fin de línea LF en todo el repo (portabilidad Windows)
        run: |
          if git ls-files --eol | grep -Eq '^i/(crlf|mixed)'; then
            echo "::error::Hay archivos versionados con CRLF o finales de línea mixtos:"
            git ls-files --eol | grep -E '^i/(crlf|mixed)'
            echo "Corrige con: git add --renormalize . && git commit -am 'chore(repo): normalizar EOL'"
            exit 1
          fi
          echo "OK: todos los archivos versionados usan LF"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: node frontend/scripts/check-pwa.mjs
      - name: Smoke — shared compilado + arranque de producción (issue #77)
        run: |
          node -e "const s = require('@terreno/shared'); if (!s.parseTemplateDefinition) { console.error('contrato Zod no exportado por @terreno/shared'); process.exit(1) }"
          (cd backend && PORT=3100 DATABASE_URL=postgres://smoke:smoke@127.0.0.1:1/terreno APP_DATABASE_URL=postgres://tc_app:smoke@127.0.0.1:1/terreno JWT_ACCESS_SECRET=ci-access-secret-32bytes-long!!!! timeout 10 node dist/main.js >/tmp/smoke.log 2>&1 &)
          sleep 4
          if grep -q "ERR_MODULE_NOT_FOUND\|Cannot find module" /tmp/smoke.log; then cat /tmp/smoke.log; exit 1; fi
          if ! grep -qi "successfully started\|Nest application" /tmp/smoke.log; then cat /tmp/smoke.log; exit 1; fi

  integration:
    name: Unit + integración (shared, frontend, backend)
    runs-on: ubuntu-latest
    env:
      DEMO_PASSWORD: TcDemo2026!
      VITE_DEMO_PASSWORD: TcDemo2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Raíz a propósito: barre los workspaces con tests. Correr sólo
      # `--workspace @terreno/backend` dejaba `shared` y `frontend` sin
      # ejecutar en CI.
      - run: npm test

  secrets-scan:
    name: Escaneo de secretos (Constitución Art. IX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
